<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Shop - Premium Tech Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">NEXUS</div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="#featured">Featured</a></li>
            </ul>
            <div class="cart-icon" onclick="toggleCart()">
                🛒
                <span class="cart-count" id="cartCount">0</span>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <div class="hero-glass">
            <h1>Welcome to Nexus</h1>
            <p>Where Innovation Meets Elegance</p>
            <button class="cta-button" onclick="scrollToProducts()">Discover Excellence</button>
        </div>
    </section>

    <!-- Featured Products -->
    <section class="featured" id="products">
        <h2 class="section-title">Premium Collection</h2>
        <div class="product-grid" id="productGrid"></div>
    </section>

    <!-- Cart Modal -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <div class="cart-header">
                <h2>Your Cart</h2>
                <div class="close-cart" onclick="toggleCart()">×</div>
            </div>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-total">
                <div class="total-label">Total:</div>
                <div class="total-price" id="totalPrice">$0</div>
            </div>
            <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
